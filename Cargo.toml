[package]
name = "mcp-firewall"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Security proxy that logs, inspects and blocks dangerous MCP traffic between an AI agent and its MCP servers"
license = "MIT"
repository = "https://github.com/notzenco/mcp-firewall"
readme = "README.md"
keywords = ["mcp", "security", "proxy", "ai-agents", "policy"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "mcp-firewall"
path = "src/main.rs"
